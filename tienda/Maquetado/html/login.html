<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MercadoLite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <header class="solo-lectores">
        <h1>MercadoLite - Inicio de sesión</h1>
    </header>

    <main class="contenedor-principal">
        <section class="tarjeta tarjeta-login">
            <header>
                <figure class="logo" aria-hidden="true">
                    <span>M</span>
                </figure>

                <h2>Bienvenido a MercadoLite</h2>
                <p>Ingresá tu nombre para empezar a comprar.</p>
            </header>

            <form action="#" method="get" class="formulario-login" aria-label="Iniciar sesión">
                <div class="grupo-formulario">
                    <label for="nombre">Decinos tu nombre</label>
                    <input type="text" id="nombre" class="campo-texto" name="nombre" placeholder="Ej. Julieta Fernández" autocomplete="name" required aria-required="true">
                </div>

                <button type="submit" class="boton boton-primario boton-ancho">Ingresar</button>
            </form>
        </section>
    </main>
</body>

</html>
