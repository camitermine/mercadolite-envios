<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis pedidos - MercadoLite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/misPedidos.css">
</head>

<body>
    <header class="barra-superior" aria-label="Barra superior">
        <a href="#" class="marca" aria-label="MercadoLite - Ir al catálogo">
            <span class="marca-icono" aria-hidden="true">M</span>
            <span class="marca-nombre">MercadoLite</span>
        </a>
        <form class="barra-busqueda" role="search">
            <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
            <input type="search" name="busqueda" placeholder="Buscar productos" aria-label="Buscar productos">
        </form>
        <a href="#" class="enlace-pedidos" aria-current="page">Mis pedidos</a>
    </header>

    <main class="estado-vacio">
        <div class="ilustracion-vacia" aria-hidden="true">
            <span>ilustración</span>
        </div>

        <div class="texto-vacio">
            <h1>Todavía no hiciste ningún pedido</h1>
            <p>Explorá el catálogo y encontrá productos para tu primer pedido.</p>
        </div>

        <a href="#" class="boton boton-primario">Explorar catálogo</a>
    </main>
</body>

</html>
