<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacer Pedido - MercadoLite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/hacerPedido.css">
</head>

<body>
    <header class="nav-volver" aria-label="Navegación secundaria">
        <a href="#" class="enlace-volver" aria-label="Volver al catálogo">
            <i class="ph ph-arrow-left" aria-hidden="true"></i>
            <span>Volver<span class="texto-catalogo"> al catálogo</span></span>
        </a>
        <a href="#" class="enlace-pedidos">Mis pedidos</a>
    </header>

    <main class="pantalla-pago">
        <h1 class="solo-lectores">Hacer pedido</h1>

        <section class="tarjeta tarjeta-resumen" aria-label="Resumen del pedido">
            <header class="item-producto">
                <figure class="miniatura-producto-pedido" aria-label="Imagen del producto">
                    <img src="../images/ice-cream.png" alt="Helado">
                </figure>

                <div class="info-producto-pedido">
                    <h2>Ice Cream</h2>
                    <p class="meta-producto">
                        <span><span class="texto-precio-unitario">Precio unitario </span>$5,49</span>
                        <span class="separador-meta" aria-hidden="true">·</span>
                        <span><span class="texto-cantidad-larga">Cantidad</span><span class="texto-cantidad-corta">Cant.</span> 42</span>
                    </p>
                </div>

                <dl class="grupo-precio">
                    <dt class="etiqueta-precio">Total</dt>
                    <dd><data class="precio" value="230.58">$230,58</data></dd>
                </dl>
            </header>
        </section>

        <section class="tarjeta tarjeta-formulario" aria-labelledby="titulo-entrega">
            <h2 id="titulo-entrega">Datos de entrega</h2>

            <form class="formulario-entrega">
                <div class="grupo-formulario">
                    <label for="nombre">Nombre y apellido</label>
                    <input id="nombre" class="campo-texto" type="text" placeholder="Ej. Julieta Fernández" required>
                </div>

                <div class="grupo-formulario campo-error">
                    <label for="email">Email</label>
                    <input id="email" class="campo-texto" type="email" placeholder="julieta.fernandez@correo" aria-invalid="true" required>
                    <small>Ingresá un email válido</small>
                </div>

                <fieldset class="fila-campos">
                    <legend class="solo-lectores">Datos de contacto y ubicación</legend>

                    <div class="grupo-formulario">
                        <label for="telefono">Teléfono</label>
                        <input id="telefono" class="campo-texto" type="tel" placeholder="11 2345-6789">
                    </div>

                    <div class="grupo-formulario">
                        <label for="localidad">Localidad</label>
                        <input id="localidad" class="campo-texto" type="text" placeholder="Ej. Palermo, CABA">
                    </div>
                </fieldset>

                <div class="grupo-formulario">
                    <label for="direccion">Dirección</label>
                    <input id="direccion" class="campo-texto" type="text" placeholder="Calle y número">
                </div>

                <div class="grupo-formulario">
                    <label for="entrega">Método de entrega</label>
                    <select id="entrega" class="campo-texto">
                        <option>Envío a domicilio</option>
                        <option>Retiro por sucursal</option>
                        <option>Entrega express</option>
                    </select>
                </div>

                <menu class="acciones">
                    <button type="button" class="boton boton-secundario">Cancelar</button>
                    <button type="submit" class="boton boton-primario">Confirmar pedido</button>
                </menu>
            </form>
        </section>
    </main>
</body>

</html>
